[project]
name = "as-personas"
version = "0.1.0"
description = "Human-grounded survey personas for the Artificial Societies technical task"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "pyarrow>=17",
    "torch>=2.6,<3",
    "transformers>=4.51,<5",
    "sentence-transformers>=4,<6",
    "scikit-learn>=1.5,<2",
    "matplotlib>=3.9,<4",
    "PyYAML>=6,<7",
    "huggingface-hub>=0.30,<1",
    "jupyterlab>=4,<5",
    "ipykernel>=6,<8",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/as_personas"]
